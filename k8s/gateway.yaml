# nginx in front of the API pods, plus the dashboard.
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer   # k3s/k3d and cloud clusters; otherwise use: kubectl port-forward svc/gateway 8080:80
  selector: { app: gateway }
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: rate-limit-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            # nginx's resolver does not use search domains: use fully qualified names
            - name: NGINX_RESOLVER
              value: kube-dns.kube-system.svc.cluster.local
            - name: API_HOST
              value: api.ratelimit.svc.cluster.local
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 64Mi }
