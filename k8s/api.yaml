# The rate-limited API: several stateless replicas, all sharing one Redis.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: api
          image: rate-limit-api
          imagePullPolicy: IfNotPresent   # images loaded locally (k3d image import); use a registry tag in production
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: api-config }
          env:
            # Shown in X-Served-By, so responses can be traced to a pod
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          # The HPA scales on CPU relative to these requests
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 192Mi }
